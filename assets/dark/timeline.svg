ize="13" fill="#ffffff">SHIPPED 3× SAP JOULE AGENTS</text><text x="104" y="374" font-family="ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-size="11" fill="#8b949e">Audit · Search · Troubleshooter — all published by SAP to Accelerator Hub.</text><circle cx="80" cy="404" r="4" fill="#6CC644"/><text x="0" y="408" font-family="ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#8b949e">2026</text><text x="104" y="408" font-family="ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-weight="700" font-size="13" fill="#ffffff">🎤 SAPPHIRE 2026</text><text x="104" y="426" font-family="ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-size="11" fill="#8b949e">MAO Warehouse Agent live on stage. 120 robots. No net.</text><circle cx="80" cy="456" r="4" fill="#6CC644"/><text x="0" y="460" font-family="ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#8b949e">2026</text><text x="104" y="460" font-family="ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-weight="700" font-size="13" fill="#ffffff">▶ DRA · HUMANOID AGENT</text><text x="104" y="478" font-family="ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-size="11" fill="#8b949e">Currently teaching a humanoid to pick, place, and inspect.</text>
